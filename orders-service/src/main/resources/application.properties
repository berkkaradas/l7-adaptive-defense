spring.application.name=orders-service
server.port=8082
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ordersdb}
spring.datasource.username=${DB_USERNAME:l7defense}
spring.datasource.password=${DB_PASSWORD:l7defense}
spring.jpa.hibernate.ddl-auto=update
spring.threads.virtual.enabled=true
# DB baglantisi Gateway'in 2 saniyelik timeout'undan once pes etmeli.
# Aksi halde Gateway 504 donup vazgectikten sonra orders-service hala
# havuzdan baglanti bekliyor olur -- kaskad ters calisir (Karar Kaydi 16.8).
spring.datasource.hikari.connection-timeout=1000