services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: l7defense
      POSTGRES_USER: l7defense
      POSTGRES_PASSWORD: l7defense
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l7defense"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/create-ordersdb.sql:/docker-entrypoint-initdb.d/create-ordersdb.sql

  # Runs as root, hands the volume to Kafka's runtime user, then exits.
  # Needed because a named volume whose mount point does not exist in the image
  # is created owned by root, which appuser (uid 1000) cannot write to.
  kafka-init:
    image: busybox:1.36
    command: ["chown", "-R", "1000:1000", "/tmp/kafka-logs"]
    volumes:
      - kafka_data:/tmp/kafka-logs

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/tmp/kafka-logs
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 15

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/l7defense
      JWT_SECRET: this-is-a-temporary-dev-secret-change-it-later-32chars-min
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ordersdb
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      JWT_SECRET: this-is-a-temporary-dev-secret-change-it-later-32chars-min
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      orders-service:
        condition: service_started
      kafka:
        condition: service_healthy
  risk-engine:
    build:
      context: .
      dockerfile: risk-engine/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
volumes:
  postgres_data:
  kafka_data: