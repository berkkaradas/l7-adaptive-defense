services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: l7defense
      POSTGRES_USER: l7defense
      POSTGRES_PASSWORD: l7defense
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l7defense"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init/create-ordersdb.sql:/docker-entrypoint-initdb.d/create-ordersdb.sql

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/l7defense
      JWT_SECRET: this-is-a-temporary-dev-secret-change-it-later-32chars-min
    depends_on:
      postgres:
        condition: service_healthy
  orders-service:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ordersdb
    depends_on:
      postgres:
        condition: service_healthy
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      JWT_SECRET: this-is-a-temporary-dev-secret-change-it-later-32chars-min
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - orders-service
volumes:
  postgres_data:

