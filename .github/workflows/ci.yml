name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Scoring and decision logic only. The Spring context test is skipped
      # because it expects a Kafka broker, which the CI runner does not have.
      - name: Risk engine unit tests
        run: >
          mvn -B -ntp -pl risk-engine -am test
          -Dtest='!RiskEngineApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false
