spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: http://auth-service:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: orders-route
              uri: http://orders-service:8082
              predicates:
                - Path=/orders/**
            - id: items-route
              uri: http://orders-service:8082
              predicates:
                - Path=/items/**

server:
  port: 8080
app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-temporary-dev-secret-change-it-later-32chars-min}