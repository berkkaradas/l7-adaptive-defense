spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Backend cagrilarinin sinirlari. Spring Cloud Gateway'in bunlar icin
          # VARSAYILANI YOK (5.0.2 configuration-metadata'da default=none) --
          # ayarlanmazsa olu bir backend'e giden istek suresiz asili kaliyor.
          # Ilk S4 kosusunda bu 30 saniyeye kadar cikti ve deneyi gecersiz kildi
          # (Karar Kaydi 16.8).
          httpclient:
            connect-timeout: 1000        # milisaniye (Integer)
            response-timeout: 2s         # Duration
          routes:
            - id: auth-route
              uri: http://auth-service:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: orders-route
              uri: http://orders-service:8082
              predicates:
                - Path=/orders/**
            - id: items-route
              uri: http://orders-service:8082
              predicates:
                - Path=/items/**
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:kafka:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      compression-type: lz4
      properties:
        "[max.block.ms]": "0"
    consumer:
      group-id: gateway
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.use.type.headers]": "false"
        "[spring.json.value.default.type]": "com.karadas.l7defense.gateway.decision.DecisionEvent"
server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-temporary-dev-secret-change-it-later-32chars-min}
  kafka:
    signals-topic: l7.signals
    decisions-topic: l7.decisions
  ratelimit:
    capacity: 20
    refill-tokens: 2
    refill-period: 1s