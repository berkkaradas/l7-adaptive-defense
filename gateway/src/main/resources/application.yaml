spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-route
              uri: http://auth-service:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: orders-route
              uri: http://orders-service:8082
              predicates:
                - Path=/orders/**
            - id: items-route
              uri: http://orders-service:8082
              predicates:
                - Path=/items/**
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:kafka:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      compression-type: lz4
      properties:
        "[max.block.ms]": "0"

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-temporary-dev-secret-change-it-later-32chars-min}
  kafka:
    signals-topic: l7.signals