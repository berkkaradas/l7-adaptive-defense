spring:
  application:
    name: risk-engine
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP:localhost:29092}"
    consumer:
      group-id: risk-engine
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.use.type.headers]": "false"
        "[spring.json.value.default.type]": "com.karadas.l7defense.riskengine.signal.SignalEvent"
    listener:
      concurrency: 1

app:
  kafka:
    signals-topic: l7.signals
  window:
    length: 180s
    max-events-per-identity: 10000
    global-error-max: 50000
    purge-interval: 60s
  store:
    authenticated-max: 10000
    unauthenticated-max: 5000
  scoring:
    weights:
      login-failure: 10
      baseline-throttle: 5
      unauthenticated: 3
      server-error: 15
    attribution:
      system-wide-error-threshold: 20
      concentration-threshold: 0.5
  decision:
    threshold:
      moderate: 50
      severe: 120
    hysteresis-ratio: 0.5
    ttl: 30s
    state-ttl: 10m

logging:
  level:
    com.karadas.l7defense.riskengine: INFO